name: Test Homebrew Casks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A release pushes one commit per cask, seconds apart, so the run for the first
# tests a tap where the other cask is still the version before. That run is
# already answered by the one behind it: cancel it rather than leave a failure
# in the history of every release. Per ref, so main and a branch don't cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macOS, not Linux. gqlhash ships as a cask since v2, and a cask installs
    # only on macOS — brew refuses it anywhere else. The formula this replaced
    # built from source, which is why ubuntu-latest worked until now.
    runs-on: macos-latest
    # Least privilege: this job only reads the repo (checkout + brew tap/install),
    # so restrict the GITHUB_TOKEN to read-only access to repository contents.
    permissions:
      contents: read

    strategy:
      # Both casks of the tap. fail-fast off, so one breaking doesn't hide
      # whether the other still installs.
      fail-fast: false
      matrix:
        cask: [gqlhash, gqlhash-proxy]

    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # brew audit --online reads the GitHub API. Unauthenticated that is 60 an
      # hour for the runner's whole IP, shared with everyone else building on it,
      # so an audit fails at random with nothing wrong with the cask.
      # The job's own token raises it to 5000 and needs no permission beyond
      # the read it already has.
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The runner ships Homebrew, so there's nothing to install first.
      - name: Tap the repository
        run: brew tap romshark/tools

      # --online checks the upstream release through the GitHub API. Unauthenticated,
      # that shares the 60-requests-per-hour anonymous budget with every other job
      # leaving the same runner IP, so the audit fails on rate limit at random.
      # The job's own GITHUB_TOKEN lifts it to the authenticated limit.
      - name: Audit the cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: brew audit --cask --online romshark/tools/${{ matrix.cask }}

      - name: Install the cask
        run: brew install --cask romshark/tools/${{ matrix.cask }}

      # brew test has no cask equivalent, so the binary is run instead.
      # This is what catches an archive that unpacks to nothing and the postflight
      # that clears the quarantine attribute: the binaries are unsigned,
      # so a release Gatekeeper still holds fails here rather than on a user's machine.
      - name: Run the installed binary
        run: ${{ matrix.cask }} -version

      - name: Uninstall the cask
        run: brew uninstall --cask romshark/tools/${{ matrix.cask }}
